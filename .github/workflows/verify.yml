name: Validar Void Rescue II

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vr2-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/landscape.spec.ts tests/e2e/spawn-mode.spec.ts tests/e2e/rescue-beam.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-screenshots
          path: |
            docs/screenshots/*landscape-city.png
            docs/screenshots/*hud-transparent.png
            test-results/**
          if-no-files-found: ignore
