name: Validar Void Rescue II

on:
  push:
    branches:
      - feat/parallax-landscapes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/landscape.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-screenshots
          path: |
            docs/screenshots/*landscape-city.png
            test-results/**
          if-no-files-found: ignore
